# Deploys a team-owned EKS cluster in its own VPC, connected back to an
# external Coder control plane via cross-region VPC peering — see
# terraform/cluster/peering.tf — and registers an external Coder provisioner
# on it. Workspace builds tagged for this team land here; the control plane
# (coderd, Postgres, Secrets Manager) stays untouched.

version: '3'

dotenv: ['.env']

tasks:

  login:
    desc: Validate AWS credentials for the configured profile/region
    cmds:
      - bash scripts/00_aws_login.sh

  cluster:
    desc: Deploy this team's EKS cluster (own VPC, EKS, CloudWatch logs, peering back to the platform)
    cmds:
      - bash scripts/10_deploy_cluster.sh

  provisioner:
    desc: Deploy the EBS CSI driver, gp3 StorageClass, and the Coder external provisioner
    cmds:
      - bash scripts/20_deploy_provisioner.sh

  up:
    desc: Full deploy — cluster, then provisioner
    cmds:
      - task: cluster
      - task: provisioner

  validate:
    desc: Terraform fmt + validate for both terraform/cluster and terraform/provisioner, plus shellcheck
    cmds:
      - terraform -chdir=terraform/cluster fmt -check -diff
      - terraform -chdir=terraform/cluster validate
      - terraform -chdir=terraform/provisioner fmt -check -diff
      - terraform -chdir=terraform/provisioner validate
      - shellcheck scripts/*.sh scripts/lib/*.sh scripts/tools/*.sh

  nuke:
    desc: Destroy this team's cluster and provisioner (control plane untouched)
    cmds:
      - bash scripts/tools/nuke.sh

  help:
    desc: Show all available tasks
    cmds:
      - task --list
